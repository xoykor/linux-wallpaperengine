name: AppImage release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version string for the AppImage filename
        required: false
        type: string

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config curl squashfs-tools \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl-dev libglew-dev freeglut3-dev libsdl2-dev liblz4-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libxxf86vm-dev libglm-dev libglfw3-dev \
            libmpv-dev libmpv2 libpulse-dev libfftw3-dev libfreetype-dev \
            libdbus-1-dev zlib1g-dev wayland-scanner++ wayland-protocols \
            libwayland-dev python3-gi gir1.2-gtk-4.0 \
            libgtk-3-0t64 libnss3 libxss1 libasound2t64 libcups2t64 \
            libavahi-client3 libavahi-common3 libgbm1 libdrm2

      - name: Configure and build engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --target linux-wallpaperengine --parallel 2

      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"

      - name: Build integrated AppImage
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          packaging/appimage/build-appimage.sh \
            --build-dir build \
            --output-dir dist \
            --version "$APP_VERSION" \
            --appimagetool "$RUNNER_TEMP/appimagetool.AppImage"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-wallpaperengine-appimage
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.sha256

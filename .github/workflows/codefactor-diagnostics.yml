name: CodeFactor diagnostics

on:
  push:
    branches:
      - codex/upstream-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install analyzers
        run: |
          python -m pip install --disable-pip-version-check \
            pycodestyle==2.14.0 pylint==3.3.7 bandit==1.9.4 \
            ruff==0.15.14 cpplint==2.0.3 yamllint==1.38.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck flawfinder

      - name: Collect changed files
        run: |
          git diff --name-only b016d7d1fdcf..HEAD > /tmp/changed.txt
          cat /tmp/changed.txt

      - name: Python diagnostics
        shell: bash
        run: |
          mapfile -t files < <(grep -E '\.py$' /tmp/changed.txt || true)
          ((${#files[@]} == 0)) && exit 0
          echo '=== pycodestyle ==='
          pycodestyle "${files[@]}" || true
          echo '=== pylint ==='
          pylint --score=n "${files[@]}" || true
          echo '=== bandit ==='
          bandit -q "${files[@]}" || true
          echo '=== ruff ==='
          ruff check "${files[@]}" || true

      - name: Shell diagnostics
        shell: bash
        run: |
          mapfile -t files < <(grep -E '(\.sh$|/AppRun$)' /tmp/changed.txt || true)
          ((${#files[@]} == 0)) && exit 0
          shellcheck "${files[@]}" || true

      - name: C and C++ diagnostics
        shell: bash
        run: |
          mapfile -t files < <(grep -E '\.(c|cc|cpp|cxx|h|hpp)$' /tmp/changed.txt || true)
          ((${#files[@]} == 0)) && exit 0
          echo '=== cpplint ==='
          cpplint "${files[@]}" || true
          echo '=== flawfinder ==='
          flawfinder --minlevel=1 "${files[@]}" || true

      - name: YAML diagnostics
        shell: bash
        run: |
          mapfile -t files < <(grep -E '\.(yml|yaml)$' /tmp/changed.txt || true)
          ((${#files[@]} == 0)) && exit 0
          yamllint "${files[@]}" || true
